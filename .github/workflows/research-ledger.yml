name: Check additive research ledger
on:
  push:
    paths: ['data/research/**', 'data/contacts.json', 'scripts/research_ledger.py', '.github/workflows/research-ledger.yml']
  pull_request:
    paths: ['data/research/**', 'data/contacts.json', 'scripts/research_ledger.py', '.github/workflows/research-ledger.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research_ledger.py --check
